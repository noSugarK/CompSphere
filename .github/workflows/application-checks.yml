name: Check application

on:
  pull_request:
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: compsphere_ci
          POSTGRES_USER: compsphere_ci
          POSTGRES_PASSWORD: ephemeral-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compsphere_ci -d compsphere_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      TEST_DATABASE_URL: postgres://compsphere_ci:ephemeral-ci-password@127.0.0.1:5432/compsphere_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy apps core config
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python -m pytest
      - run: python manage.py spectacular --format openapi-json --file ../docs/openapi.json --validate --fail-on-warn
      - run: git diff --exit-code -- ../docs/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run api:generate
      - run: git diff --exit-code -- src/api/generated.d.ts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
