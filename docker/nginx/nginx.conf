# 入口 Nginx（docker-compose nginx 服务挂载）
# 拓扑：浏览器 → nginx:80 → frontend:80（SPA 静态，dist 已打进镜像）
#                           → backend:8000（/api、/healthz、证书验证页）
# HTTPS：生产在 server 80 之上加 443 + cert，先按 HTTP 起步。

proxy_connect_timeout 5s;
proxy_read_timeout 60s;
client_max_body_size 25m;          # 报名材料单文件 ≤ 20MB（PRD §6），留余量
# 本文件被挂载为 conf.d/default.conf，运行在 http 上下文，可定义 zone
limit_req_zone $binary_remote_addr zone=verify:10m rate=5r/s;

upstream backend_app { server backend:8000; }
upstream frontend_app { server frontend:80; }

server {
    listen 80;
    server_name _;

    # --- 后端 API ---
    location /api/ {
        proxy_pass http://backend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 证书公开验证页（AllowAny，独立限流）
    location /verify/ {
        limit_req zone=verify burst=10 nodelay;
        proxy_pass http://backend_app;
        proxy_set_header Host $host;
    }

    location /healthz/ {
        proxy_pass http://backend_app;
        access_log off;
    }

    # Django admin（仅建议内网开放；公网可整段删除）
    location /django-admin/ {
        proxy_pass http://backend_app;
        proxy_set_header Host $host;
    }

    # --- 前端 SPA ---
    location / {
        proxy_pass http://frontend_app;
        proxy_set_header Host $host;
    }
}
