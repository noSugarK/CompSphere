repos:
  - repo: local
    hooks:
      - id: backend-lint
        name: Backend Ruff
        language: system
        entry: python -m ruff check --config backend/pyproject.toml
        files: ^backend/.*\.py$
      - id: backend-format
        name: Backend formatting
        language: system
        entry: python -m ruff format --check --config backend/pyproject.toml
        files: ^backend/.*\.py$
      - id: frontend-lint
        name: Frontend ESLint
        language: system
        entry: npm --prefix frontend run lint
        files: ^frontend/(?!prototype/)
        pass_filenames: false
      - id: frontend-format
        name: Frontend formatting
        language: system
        entry: npm --prefix frontend run format:check
        files: ^frontend/(?!prototype/)
        pass_filenames: false
